
name: Coinbase Futures API Test

on:
  workflow_dispatch:

jobs:
  test-coinbase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Coinbase API
        run: python coinbase_test.py
        
