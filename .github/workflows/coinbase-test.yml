# Coinbase futures API test
name: Coinbase Futures API Test

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
    

jobs:
  test-coinbase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Coinbase API
        run: python coinbase_scan.py
        
